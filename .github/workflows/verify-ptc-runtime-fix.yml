name: Verify #9677 production PTC fix

on:
  push:
    branches:
      - verify/9677-ptc-session-safe-ids

permissions:
  contents: read

jobs:
  ptc-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.28.5
      - run: pnpm install --frozen-lockfile
      - name: Run real production PTC Vitest suite
        run: pnpm exec vitest run packages/core/tools/tests/ptc.spec.ts
      - name: Run source type checks
        run: pnpm exec tsc -b packages/core/tools/tsconfig.json
